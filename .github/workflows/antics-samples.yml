# Test run of the Animal Antics worker: makes a few real sample videos end to end
# and pushes them to the antics-samples branch for review.
name: Animal Antics samples (test run)

on:
  push:
    branches: [claude/animal-antics]
    paths: [animals/worker/**, .github/workflows/antics-samples.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dog
            source: "commons:dog"
          - name: cat
            source: "commons:cat"
          - name: surprise
            source: surprise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - run: pip install -q -r animals/worker/requirements.txt
      - name: Make the sample
        working-directory: animals/worker
        timeout-minutes: 40
        env:
          ANTICS_DATA: /tmp/antics
        run: python make_samples.py "${{ matrix.source }}" 2 "$GITHUB_WORKSPACE/out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.name }}
          path: out/${{ matrix.name }}

  publish:
    needs: sample
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: samples
          pattern: sample-*
      - name: Push to the antics-samples branch
        run: |
          cd samples
          git init -q -b antics-samples
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sample videos from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" antics-samples
