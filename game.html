<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Pulse</title>
  <link rel="stylesheet" href="game.css">
  <script defer src="game.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="board"></canvas>
    <button id="pauseBtn" class="hidden" aria-label="Pause">&#10074;&#10074;</button>

    <div id="menu" class="overlay">
      <h1>NEON<span>PULSE</span></h1>
      <p class="sub">4-lane rhythm game</p>
      <div class="diffs" role="radiogroup" aria-label="Difficulty">
        <button type="button" data-diff="easy">EASY<small>Lv.5</small></button>
        <button type="button" data-diff="normal">NORMAL<small>Lv.12</small></button>
        <button type="button" data-diff="hard">HARD<small>Lv.22</small></button>
      </div>
      <p class="best" id="best"></p>
      <button type="button" id="startBtn" class="primary">PLAY</button>
      <details class="settings">
        <summary>Settings</summary>
        <label>Note speed <input type="range" id="speed" min="1" max="10" step="0.5"> <output id="speedOut"></output></label>
        <label>Audio offset <input type="range" id="offset" min="-150" max="150" step="5"> <output id="offsetOut"></output></label>
        <label class="check"><input type="checkbox" id="hitsound"> Hit sounds</label>
      </details>
      <p class="help">Keys <kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd> &middot; or tap the lanes<br>Hold long notes until they end &middot; <kbd>Esc</kbd> pauses</p>
      <a href="index.html" class="back">&larr; Back to store</a>
    </div>

    <div id="pause" class="overlay hidden">
      <h2>PAUSED</h2>
      <button type="button" id="resumeBtn" class="primary">RESUME</button>
      <button type="button" id="restartBtn">RESTART</button>
      <button type="button" id="quitBtn">QUIT</button>
    </div>

    <div id="results" class="overlay hidden">
      <p class="res-diff" id="resDiff"></p>
      <div class="rank" id="resRank"></div>
      <p class="badge" id="resBadge"></p>
      <p class="res-score" id="resScore"></p>
      <p class="new-best hidden" id="resBest">NEW BEST!</p>
      <table class="counts">
        <tr><th class="perfect">PERFECT</th><td id="cPerfect"></td></tr>
        <tr><th class="great">GREAT</th><td id="cGreat"></td></tr>
        <tr><th class="good">GOOD</th><td id="cGood"></td></tr>
        <tr><th class="miss">MISS</th><td id="cMiss"></td></tr>
        <tr><th>MAX COMBO</th><td id="cCombo"></td></tr>
        <tr><th>ACCURACY</th><td id="cAcc"></td></tr>
      </table>
      <button type="button" id="retryBtn" class="primary">RETRY</button>
      <button type="button" id="menuBtn">MENU</button>
    </div>
  </div>
</body>
</html>
